<!-- Navigation Shell Suppression: 
         This is a transactional/linear flow ('Find Your Profile' before booking).
         BottomNavBar is intentionally omitted to prioritize the input canvas. -->
<script>
        // Simple Interaction Logic for Demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const inputState = document.getElementById('input-state');
            const successState = document.getElementById('success-state');
            const findBtn = document.getElementById('find-profile-btn');
            const wrongNumberBtn = document.getElementById('wrong-number-btn');
            const phoneInput = document.getElementById('phone-number');

            // Simulate finding profile
            findBtn.addEventListener('click', () => {
                // Basic validation visual
                if(phoneInput.value.length < 5) {
                    phoneInput.parentElement.classList.add('border-error');
                    setTimeout(() => phoneInput.parentElement.classList.remove('border-error'), 1000);
                    return;
                }

                // Transition states
                findBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>';
                
                setTimeout(() => {
                    inputState.classList.add('hidden-state');
                    inputState.classList.remove('fade-in');
                    
                    successState.classList.remove('hidden-state');
                    successState.classList.add('flex');
                    successState.classList.add('fade-in');
                    
                    // Reset button
                    findBtn.innerHTML = '<span>Find Profile</span><span class="material-symbols-outlined text-[18px]">search</span>';
                }, 800);
            });

            // Reset back to input
            wrongNumberBtn.addEventListener('click', () => {
                successState.classList.add('hidden-state');
                successState.classList.remove('flex', 'fade-in');
                
                inputState.classList.remove('hidden-state');
                inputState.classList.add('fade-in');
                
                phoneInput.value = '';
                phoneInput.focus();
            });
            
            // Format phone number slightly as typing (very basic)
            phoneInput.addEventListener('input', function (e) {
                let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,3})(\d{0,4})/);
                e.target.value = !x[2] ? x[1] : x[1] + '-' + x[2] + (x[3] ? '-' + x[3] : '');
            });
        });
    </script>
